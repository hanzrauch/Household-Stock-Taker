<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>Household Stock Taker</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Stock Taker">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
  <header class="app-header">
    <h1>Household Stock Taker</h1>
    <div class="stats" id="stats"></div>
  </header>

  <main>
    <section class="toolbar">
      <input id="search" type="search" placeholder="Search name, brand or barcode..." autocomplete="off">
      <select id="categoryFilter" aria-label="Filter by category">
        <option value="">All categories</option>
      </select>
      <button id="manageCategoriesBtn" class="link-button" aria-label="Manage categories">Manage</button>
      <label class="toggle">
        <input type="checkbox" id="lowOnly"> Low stock only
      </label>
      <button id="addBtn" class="primary">+ Add item</button>
    </section>

    <section id="itemList" class="item-list" aria-live="polite"></section>
    <p id="emptyMsg" class="empty" hidden>No items match. Add one to get started.</p>
  </main>

  <!-- Item form modal -->
  <dialog id="itemModal" class="modal">
    <form method="dialog" id="itemForm">
      <header>
        <h2 id="itemModalTitle">Add item</h2>
        <button type="button" class="close" data-close aria-label="Close">&times;</button>
      </header>

      <div class="form-body">
        <div class="scan-row">
          <button type="button" id="formScanBtn" class="scan-chip">
            <span aria-hidden="true">📷</span> Scan barcode
          </button>
          <div id="formBarcode" class="barcode-display" hidden></div>
        </div>

        <div class="image-picker">
          <div class="image-preview" id="imagePreview">
            <span class="placeholder">No image</span>
          </div>
          <div class="image-actions">
            <label class="btn">
              Take photo
              <input type="file" name="imageFile" accept="image/*" capture="environment" hidden>
            </label>
            <label class="btn">
              Choose photo
              <input type="file" name="imageFile2" accept="image/*" hidden>
            </label>
            <button type="button" class="btn link" id="imageClear" hidden>Remove</button>
          </div>
          <input type="hidden" name="imageUrl" id="imageUrlInput">
        </div>

        <div class="grid">
          <label class="span-2">Name *
            <input name="name" type="text" required autocomplete="off">
          </label>
          <label>Brand
            <input name="brand" type="text" autocomplete="off">
          </label>
          <label>Category
            <select name="category" id="categorySelect">
              <option value="">— none —</option>
            </select>
          </label>
          <label>Quantity
            <input name="quantity" type="number" step="any" value="0" min="0">
          </label>
          <label>Min. quantity (reorder at)
            <input name="minQuantity" type="number" step="any" value="1" min="0">
          </label>
          <label class="span-2" id="packageSizeLabel" hidden>Package size
            <input name="packageSize" type="text" readonly>
          </label>
        </div>
      </div>

      <footer class="modal-footer">
        <button type="button" class="link" data-close>Cancel</button>
        <button type="submit" class="primary" id="itemSave">Save</button>
      </footer>
    </form>
  </dialog>

  <!-- Item detail modal -->
  <dialog id="detailModal" class="modal">
    <header>
      <h2>Item</h2>
      <button type="button" class="close" data-close aria-label="Close">&times;</button>
    </header>
    <article id="detailContent"></article>
    <footer class="modal-footer">
      <button type="button" class="link" data-close>Close</button>
    </footer>
  </dialog>

  <!-- Manage categories modal -->
  <dialog id="categoriesModal" class="modal">
    <header>
      <h2>Manage categories</h2>
      <button type="button" class="close" data-close aria-label="Close">&times;</button>
    </header>
    <article>
      <div class="manage-add">
        <input type="text" id="newCategoryInput" placeholder="New category name" autocomplete="off">
        <button type="button" id="addCategoryBtn" class="primary">Add</button>
      </div>
      <ul id="categoriesList" class="categories-list"></ul>
      <p class="hint">Renaming propagates to every item using that category. Deleting a category in use will prompt you to clear or reassign first.</p>
    </article>
    <footer class="modal-footer">
      <button type="button" class="link" data-close>Close</button>
    </footer>
  </dialog>

  <!-- Scanner modal -->
  <dialog id="scanModal" class="modal scan">
    <header>
      <h2>Scan barcode</h2>
      <button type="button" class="close" data-close aria-label="Close">&times;</button>
    </header>
    <div class="scanner">
      <video id="scanVideo" playsinline muted></video>
      <p id="scanStatus" class="scan-status">Point the camera at a barcode.</p>
    </div>
    <footer class="modal-footer">
      <button type="button" class="link" data-close>Close</button>
    </footer>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>
  <script src="/app.js" type="module"></script>
</body>
</html>
