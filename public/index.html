<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>Household Stock Taker</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="app-header">
    <h1>Household Stock Taker</h1>
    <div class="stats" id="stats"></div>
  </header>

  <main>
    <section class="toolbar">
      <input id="search" type="search" placeholder="Search name, brand or barcode..." autocomplete="off">
      <label class="toggle">
        <input type="checkbox" id="lowOnly"> Low stock only
      </label>
      <button id="addBtn" class="primary">+ Add item</button>
      <button id="scanBtn">Scan barcode</button>
    </section>

    <section id="itemList" class="item-list" aria-live="polite"></section>
    <p id="emptyMsg" class="empty" hidden>No items match. Add one to get started.</p>
  </main>

  <!-- Item form modal -->
  <dialog id="itemModal" class="modal">
    <form method="dialog" id="itemForm">
      <header>
        <h2 id="itemModalTitle">Add item</h2>
      </header>
      <div class="grid">
        <label>Barcode
          <input name="barcode" type="text" inputmode="numeric">
        </label>
        <label class="span-2">Name *
          <input name="name" type="text" required>
        </label>
        <label>Brand
          <input name="brand" type="text">
        </label>
        <label>Category
          <input name="category" type="text">
        </label>
        <label>Quantity
          <input name="quantity" type="number" step="any" value="0" min="0">
        </label>
        <label>Unit
          <input name="unit" type="text" value="items" list="unit-list">
          <datalist id="unit-list">
            <option>items</option><option>bottles</option><option>cans</option>
            <option>boxes</option><option>packs</option><option>rolls</option>
            <option>ml</option><option>l</option><option>g</option><option>kg</option>
          </datalist>
        </label>
        <label>Min. quantity (reorder at)
          <input name="minQuantity" type="number" step="any" value="1" min="0">
        </label>
        <label>Package size
          <input name="packageSize" type="text" placeholder="e.g. 500 ml">
        </label>
        <label class="span-2">Image URL
          <input name="imageUrl" type="url">
        </label>
        <label class="span-2">Notes
          <textarea name="notes" rows="2"></textarea>
        </label>
      </div>
      <footer class="modal-footer">
        <button type="button" class="link" id="itemCancel">Cancel</button>
        <button type="submit" class="primary" id="itemSave">Save</button>
      </footer>
    </form>
  </dialog>

  <!-- Item detail modal -->
  <dialog id="detailModal" class="modal">
    <article id="detailContent"></article>
    <footer class="modal-footer">
      <button type="button" class="link" id="detailClose">Close</button>
    </footer>
  </dialog>

  <!-- Scanner modal -->
  <dialog id="scanModal" class="modal scan">
    <header><h2>Scan barcode</h2></header>
    <div class="scanner">
      <video id="scanVideo" playsinline muted></video>
      <p id="scanStatus" class="scan-status">Point the camera at a barcode.</p>
    </div>
    <footer class="modal-footer">
      <select id="scanCamera"></select>
      <button type="button" class="link" id="scanClose">Close</button>
    </footer>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>
  <script src="/app.js" type="module"></script>
</body>
</html>
