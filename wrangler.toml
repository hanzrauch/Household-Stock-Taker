name = "household-stock-taker"
main = "src/index.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "household_stock"
# Fill in with the id printed by `wrangler d1 create household_stock`.
database_id = "REPLACE_WITH_YOUR_D1_ID"
migrations_dir = "migrations"

[observability]
enabled = true
